url: "https://valentinhuber.me" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/"
title: "valentinhuber.me"
permalink: /:categories/:title.html
author: Valentin Huber
plugins:
  - jekyll-feed
  - jekyll-redirect-from
future: true
defaults:
  - scope:
      path: "*"
    values:
      layout: "default"
      language: "en"
  - scope:
      path: "blog"
      type: posts
    values:
      layout: "post"
      author:
        name: "Valentin Huber"
        picture: "/assets/valentin.jpeg"
  - scope:
      path: "blog/de"
    values:
      language: "de"
